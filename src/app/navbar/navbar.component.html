<nav class="nav" [class.sticky]="isSticky">
  <a routerLink="/home" fragment="home">
    <img
      src="/images/ecoflowLogo.png"
      alt="Ecoflow logo"
      class="nav__logo"
      id="logo"
    />
  </a>

  <ul class="nav__links">
    <li class="nav__item">
      <a class="nav__link" routerLink="/home" fragment="home">{{
        "NAV_HOME" | translate
      }}</a>
    </li>
    <li class="nav__item">
      <a class="nav__link" routerLink="/home" fragment="section--technology">{{
        "NAV_TECHNOLOGY" | translate
      }}</a>
    </li>
    <li class="nav__item">
      <a class="nav__link" routerLink="/products">{{
        "NAV_PRODUCTS" | translate
      }}</a>
    </li>
    <li class="nav__item">
      <a
        class="nav__link"
        routerLink="/calculator"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ "NAV_CALCULATOR" | translate }}</a
      >
    </li>
    <li class="nav__item mobile_hidden">
      <a class="nav__link" routerLink="/home" fragment="section--benefits">{{
        "NAV_BENEFITS" | translate
      }}</a>
    </li>
    <li class="nav__item mobile_hidden">
      <a class="nav__link" routerLink="/home" fragment="section--industries">{{
        "NAV_INDUSTRIES" | translate
      }}</a>
    </li>
    <li class="nav__item">
      <button
        class="nav__link nav__link--btn btn--contact"
        routerLink="/contact"
      >
        {{ "NAV_CONTACT" | translate }}
      </button>
    </li>
    <li class="nav__item nav__item--lang">
      <button
        class="nav__link nav__link--btn lang-btn"
        [ngClass]="langClass"
        (click)="onToggleLang()"
      >
        {{ currentLang === "en" ? "EN" : "SR" }}
      </button>
    </li>
  </ul>
</nav>
